[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oscc-survival-risk-predictor"
version = "0.2.0"
description = "Offline Streamlit app for OSCC DeepSurv survival-risk prediction."
requires-python = ">=3.10"
dependencies = [
  "streamlit",
  "numpy",
  "pandas",
  "scikit-learn",
  "torch",
  "openpyxl",
]

[project.scripts]
oscc = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
